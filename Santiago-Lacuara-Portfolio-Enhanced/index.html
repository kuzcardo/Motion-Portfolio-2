<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Santiago Lacuara — Motion Graphics Designer. Motion narrative, kinetic typography, logo animation, UX/UI and generative visuals." />
    <meta name="theme-color" content="#050505" />
    <script>
      // apply the saved theme before anything paints (dark is the default)
      try { if (localStorage.getItem('theme') === 'light') { document.documentElement.classList.add('theme-light'); document.documentElement.style.colorScheme = 'light'; document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F3EEE6'); } } catch (e) {}
    </script>
    <meta property="og:title" content="Santiago Lacuara — Motion Graphics" />
    <meta property="og:description" content="Motion Graphics Designer. Bringing static ideas to life through dynamic storytelling." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&family=Syne:wght@400;500;600;700;800&family=Poppins:wght@700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" />
    <title>Santiago Lacuara — Motion Graphics</title>
  </head>

  </body>
</html>
